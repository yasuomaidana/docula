[package]
name = "docula-exemplar"
version = "0.1.0"
edition = "2024"
authors = ["docula contributors"]
license = "MIT OR Apache-2.0"
description = "Few-shot exemplar management and dual-stage layout retrieval for docula"

[dependencies]
docula-core = { path = "../docula-core" }
docula-ocr = { path = "../docula-ocr" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
strsim = "0.11"
