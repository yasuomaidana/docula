[package]
name = "docula-core"
version = "0.1.0"
edition = "2024"
authors = ["docula contributors"]
license = "MIT OR Apache-2.0"
description = "Core primitives, geometry, and abstractions for the docula document intelligence engine"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
sha2 = "0.11"
thiserror = { version = "2.0" }
toml = { version = "1", optional = true }
zeroize = "1"

[dev-dependencies]
serde_json = { version = "1.0" }
tempfile = "3.27.0"
toml = "1"
zeroize = "1"

[features]
default = ["toml"]
toml = ["dep:toml"]
