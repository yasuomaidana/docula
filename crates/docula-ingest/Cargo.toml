[package]
name = "docula-ingest"
version = "0.1.0"
edition = "2024"
authors = ["docula contributors"]
license = "MIT OR Apache-2.0"
description = "PDF hierarchy inspection, font ToUnicode validation, and intelligent document routing heuristics"
readme = "README.md"

[dependencies]
docula-core = { path = "../docula-core" }
lopdf = "0.45"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
zip = { version = "9.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
csv = "1.4"

[dev-dependencies]
rstest = "0.28.0"
