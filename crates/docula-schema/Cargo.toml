[package]
name = "docula-schema"
version = "0.1.0"
edition = "2024"
authors = ["docula contributors"]
license = "MIT OR Apache-2.0"
description = "JSON Schema to DFA compiler, autoregressive logits masking, and validation for docula"

[dependencies]
docula-core = { path = "../docula-core" }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
