[package]
name = "docula-hitl"
version = "0.1.0"
edition = "2024"
authors = ["docula contributors"]
license = "MIT OR Apache-2.0"
description = "Human-in-the-loop triage gates, correction triads, and active learning flywheel for docula"

[dependencies]
docula-exemplar = { path = "../docula-exemplar" }
docula-ocr = { path = "../docula-ocr" }
docula-schema = { path = "../docula-schema" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
diesel = { version = "2.3.14", features = ["sqlite", "postgres", "returning_clauses_for_sqlite_3_35"] }
diesel-cte-ext = { version = "0.3.0", features = ["sqlite", "postgres"] }

[dev-dependencies]
docula-core = { path = "../docula-core" }
tempfile = "3.27.0"
