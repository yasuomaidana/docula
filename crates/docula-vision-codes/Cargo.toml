[package]
name = "docula-vision-codes"
version = "0.1.0"
edition = "2024"
authors = ["docula contributors"]
license = "MIT OR Apache-2.0"
description = "Pure-Rust optical code detection, 1D/2D barcode mapping, and financial QR parsing for docula"

[dependencies]
docula-core = { path = "../docula-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rxing = "0.6"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.27.0"
