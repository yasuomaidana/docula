[package]
name = "docula-cli"
version = "0.1.0"
edition = "2024"
authors = ["docula contributors"]
license = "MIT OR Apache-2.0"
description = "Terminal command-line utility for the docula document intelligence engine"

[[bin]]
name = "docula"
path = "src/main.rs"

[dependencies]
docula = { path = "../.." }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3.27.0"
pdf_oxide = { version = "0.3", features = ["rendering"] }
assert_cmd = "2.0"
predicates = "3.1"
rxing = "0.9.3"
