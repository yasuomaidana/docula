[workspace]
resolver = "2"
members = [
    ".",
    "crates/docula-core",
    "crates/docula-preprocess",
]

[workspace.dependencies]
testcontainers = "0.28"
testcontainers-modules = "0.20"

[package]
name = "docula"
version = "0.1.0"
edition = "2024"

[dependencies]
docula-core = { path = "crates/docula-core" }
docula-preprocess = { path = "crates/docula-preprocess" }
