# Docula Configuration File (consumer template)
#
# Mirrors `docula_core::DoculaConfig` (docs/15_CONSUMER_CONFIGURATION_AND_TOML.md).
# Every key is optional: missing keys fall back to in-memory defaults, and unknown keys
# are rejected with `ConfigError::ParseFailure` to catch typos early.
#
# Load with `DoculaConfig::from_file(path)` or `DoculaConfig::from_toml_str(include_str!(..))`.

[general]
engine_name = "docula"
version = "0.1.0"
# max_threads = 8                    # Omit to let the runtime decide

# -----------------------------------------------------------------------------
# Few-Shot Exemplar Management & Dual-Stage Retrieval
# -----------------------------------------------------------------------------
[exemplars]
enabled = true
pool_directory = "./data/examples"   # Omit for ephemeral in-memory mode
max_injected_exemplars = 2           # Capped (1..=8) to prevent prompt bloat and latency
similarity_threshold = 0.82          # Minimum cosine similarity for Stage 2 fallback
stage1_fast_match = true             # Deterministic layout fingerprint matching (<1ms)
stage2_hnsw_fallback = true          # Semantic HNSW vector fallback

# -----------------------------------------------------------------------------
# Human-in-the-Loop (HITL) & Active Learning Flywheel
# -----------------------------------------------------------------------------
[hitl]
enabled = true
cold_archive_directory = "./data/corrections"  # Omit for ephemeral in-memory mode
min_token_confidence = 0.85
min_recurrence_for_promotion = 3     # Require at least 3 occurrences before promotion
auto_promote = false                 # Require explicit review to prevent prompt poisoning

# -----------------------------------------------------------------------------
# Edge Compliance, Non-Storing Directives & Optical Codes
# -----------------------------------------------------------------------------
[compliance]
zero_data_egress = true
ephemeral_image_ttl_seconds = 86400  # Discard pixel buffer after 24h review window
unannotated_qr_code = "decode"       # Options: decode, mask, censor, ignore
unannotated_1d_barcode = "mask"      # Options: decode, mask, censor, ignore
auto_censor_pii = true               # Deterministic PII pre-sanitization before LLM inference
strip_non_storing_fields = true      # Exclude NonStored<T> fields from persistent serialization

# -----------------------------------------------------------------------------
# OCR
# -----------------------------------------------------------------------------
[ocr]
# model_dir = "/opt/docula/models"   # Omit to use default assets
dpi = 300
default_languages = ["en"]
